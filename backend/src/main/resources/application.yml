server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/footprint?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

jwt:
  secret: footprint-travel-trace-jwt-secret-key-2024-very-long-secret-key-for-security
  expiration: 86400000

logging:
  level:
    com.traveltrace.footprint: DEBUG
    org.springframework.security: INFO